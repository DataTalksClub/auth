name: CI and deploy auth policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-policy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SECRETS_REGION: eu-west-1
  SECRETS_TABLE_NAME: dataops-v1-secrets
  SECRETS_KEY_ID: arn:aws:kms:eu-west-1:817685572750:key/420b802e-1d2c-4a51-95e7-f798381303bb
  STACK_NAME: dtcdev-shared-auth
  DEPLOY_ROLE_ARN: arn:aws:iam::817685572750:role/shared-auth-github-actions-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pytest --with ruff ruff check .
      - run: uv run --with pytest python -m pytest
      - run: node --test tests/test_device_login.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: shared-auth-policy
          aws-region: ${{ env.AWS_REGION }}
      - name: Package policy Lambda
        run: |
          zip -j domain-guard.zip src/index.py
          zip -j mcp-oauth.zip src/oauth_server.py src/index.py src/dataops_secrets.py
      - name: Deploy policy Lambda
        run: |
          function_name=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" \
            --logical-resource-id DomainGuardFunction \
            --query StackResourceDetail.PhysicalResourceId \
            --output text)
          aws lambda update-function-code \
            --function-name "$function_name" \
            --zip-file fileb://domain-guard.zip >/dev/null
          aws lambda wait function-updated --function-name "$function_name"
          oauth_fn=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResources[?LogicalResourceId=='McpOAuthFunction'].PhysicalResourceId | [0]" \
            --output text)
          if [ -n "$oauth_fn" ] && [ "$oauth_fn" != "None" ]; then
            aws lambda update-function-code \
              --function-name "$oauth_fn" \
              --zip-file fileb://mcp-oauth.zip >/dev/null
            aws lambda wait function-updated --function-name "$oauth_fn"
          fi
      - name: Verify live deployment
        run: uv run --with boto3 python scripts/verify_deployment.py --live

